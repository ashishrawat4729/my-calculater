
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      font-family: Arial, sans-serif;
    }
    .calculator {
      width: 320px;
      padding: 22px;
      background: #202938;
      border-radius: 20px;
      box-shadow: 0 12px 35px #0006;
    }
    h2 {
      color: white;
      text-align: center;
      margin-top: 0;
    }
    #display {
      width: 100%;
      height: 65px;
      margin-bottom: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 28px;
      text-align: right;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }
    button {
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    button:hover { background: #526176; }
    .operator { background: #2563eb; }
    .clear { background: #dc2626; }
    .equal {
      background: #16a34a;
      grid-row: span 2;
      height: 113px;
    }
    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h2>My Calculator</h2>
    <input id="display" value="0" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="backspace()">⌫</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="digit('0')">0</button>
      <button onclick="digit('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    let current = '0';
    let previous = null;
    let operator = null;
    let fresh = true;

    function show() {
      display.value = current;
    }

    function digit(value) {
      if (fresh) {
        current = value === '.' ? '0.' : value;
        fresh = false;
      } else if (value === '.' && current.includes('.')) {
        return;
      } else if (current === '0' && value !== '.') {
        current = value;
      } else {
        current += value;
      }
      show();
    }

    function chooseOperator(op) {
      if (operator && !fresh) calculate();
      previous = Number(current);
      operator = op;
      fresh = true;
    }

    function calculate() {
      if (operator === null || previous === null) return;
      const a = previous;
      const b = Number(current);
      let result;

      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) {
            current = 'Cannot divide by zero';
            previous = null;
            operator = null;
            fresh = true;
            show();
            return;
          }
          result = a / b;
          break;
        case '%': result = a % b; break;
      }

      current = String(Number(result.toPrecision(10)));
      previous = null;
      operator = null;
      fresh = true;
      show();
    }

    function clearDisplay() {
      current = '0';
      previous = null;
      operator = null;
      fresh = true;
      show();
    }

    function backspace() {
      if (fresh) return;
      current = current.length > 1 ? current.slice(0, -1) : '0';
      show();
    }
  </script>
</body>
</html>
